name: agent-activity-dashboard

services:
  server:
    image: agent-activity-dashboard-server:local
    build:
      context: .
      target: server
    environment:
      VIEWER_TOKEN: ${VIEWER_TOKEN:?set VIEWER_TOKEN in .env for dashboard browser access}
      BRAIN_ADMIN_TOKEN: ${BRAIN_ADMIN_TOKEN:?set a separate BRAIN_ADMIN_TOKEN in .env}
      ANONYMIZE: ${ANONYMIZE:-1}
      ANONYMIZE_SALT: ${ANONYMIZE_SALT:-aad-local-docker}
      RETENTION_DAYS: ${RETENTION_DAYS:-60}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-1800000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    restart: unless-stopped
    volumes:
      - aad-data:/app/server/data

  dashboard:
    image: agent-activity-dashboard-ui:local
    build:
      context: .
      target: dashboard
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${AAD_HOST:-127.0.0.1}:${AAD_PORT:-18418}:8080"
    restart: unless-stopped

volumes:
  aad-data:
