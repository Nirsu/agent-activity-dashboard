# Combine compose.yaml, compose.cognee.yaml, and this file for the Brain stack.
# The optional legacy registration mount requires a complete Git checkout.
# Projects added in the UI use the persistent server data volume for GitHub caches.
services:
  server:
    depends_on:
      cognee:
        condition: service_healthy
    environment:
      VIEWER_TOKEN: ${VIEWER_TOKEN:?set VIEWER_TOKEN in .env for Brain behind the proxy}
      BRAIN_ADMIN_TOKEN: ${BRAIN_ADMIN_TOKEN:?set a separate BRAIN_ADMIN_TOKEN in .env}
      BRAIN_DB_PATH: /app/server/data/brain.db
      BRAIN_PROJECTS_PATH: /sources/repo/brain.projects.json
      BRAIN_GITHUB_TOKEN: ${BRAIN_GITHUB_TOKEN:-}
      BRAIN_GITHUB_CACHE_PATH: /app/server/data/brain-repositories
      BRAIN_MODEL: ${BRAIN_MODEL:-}
      BRAIN_REQUEST_TIMEOUT_MS: ${BRAIN_REQUEST_TIMEOUT_MS:-0}
      BRAIN_NOTION_REDIRECT_URL: ${BRAIN_NOTION_REDIRECT_URL:?set the externally reachable Notion OAuth callback URL}
      BRAIN_SYNC_MODE: ${BRAIN_SYNC_MODE:-poll}
      BRAIN_GITHUB_WEBHOOK_SECRET: ${BRAIN_GITHUB_WEBHOOK_SECRET:-}
      BRAIN_GITHUB_WEBHOOK_PROJECTS: ${BRAIN_GITHUB_WEBHOOK_PROJECTS:-{}}
      BRAIN_NOTION_WEBHOOK_VERIFICATION_TOKEN: ${BRAIN_NOTION_WEBHOOK_VERIFICATION_TOKEN:-}
      COGNEE_API_URL: http://cognee:8000
      COGNEE_USERNAME: ${COGNEE_USERNAME:-brain@example.com}
      COGNEE_PASSWORD: ${COGNEE_PASSWORD:?set COGNEE_PASSWORD in .env}
      COGNEE_API_TOKEN: ${COGNEE_API_TOKEN:-}
      COGNEE_LLM_MODEL: ${COGNEE_LLM_MODEL:-openai/${BRAIN_MODEL:-gpt-5.6-luna}}
      COGNEE_EMBEDDING_MODEL: ${COGNEE_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      COGNEE_EMBEDDING_DIMENSIONS: ${COGNEE_EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - type: bind
        source: ${BRAIN_REPO_MOUNT:-.}
        target: /sources/repo
        read_only: true
        bind:
          create_host_path: false
